name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
      - uses: treeform/setup-nim-action@v6
      - run: cd .. && nimby create
      - run: nimby sync nimby.lock
      - run: nim check src/jumper.nim
      - run: nim r tests/tests.nim
      - run: nim c --path:src --out:/tmp/jumper-training-bridge src/jumper/training_bridge.nim
      - run: python3 tests/training_bridge.py /tmp/jumper-training-bridge "$PWD"
